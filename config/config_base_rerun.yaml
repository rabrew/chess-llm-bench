# Chess LLM Benchmark Configuration — base re-run for the fine-tuning comparison (specs/finetuned-benchmark-run.md)

stockfish:
  path: /usr/games/stockfish
  depth: 15  # Reduced from 22 for ~4x speedup
  threads: 1
  workers: 24  # Parallel Stockfish instances

lc0:
  binary: /home/rabrew/lc0-src/build/release/lc0
  weights: /home/rabrew/lc0-nets/network.pb
  onnx_model: /home/rabrew/lc0-nets/network.onnx
  nodes: 800  # Search budget per position for CPL ground truth (enrich_cpl.py)

ollama:
  base_url: http://localhost:11434
  timeout: 600
  max_retries: 3

models:
  # Bases of the batch-1 fine-tuned models, re-run on current code so base and
  # fine-tuned answers share the same worker, rescue and prompts
  # (specs/finetuned-benchmark-run.md, "Base re-run"; issues-log Issue 18).
  - llama3.2:3b
  - gemma3:4b
  - qwen2.5:7b
  - mistral:7b
  - deepseek-r1:7b

dataset:
  lichess_source: local  # "api" or "local"
  lichess_csv_path: data/lichess_puzzles.csv
  pgn_path: data/games.pgn

benchmark:
  max_positions_per_tier: 1000  # 1000 x 4 tiers = 4,000 total positions
  random_seed: 42
  prompt_formats:
    - fen_only
    - pgn+fen
    - cot
    - eval_only
    - move_only
    - explanation_only

evaluation:
  cpl_threshold: 50
  centipawn_eval_range:
    min: -2000
    max: 2000

workers:
  count: 1

correction_loop:
  # DISABLED — dead code. The trigger checks t2_cpl > threshold at the
  # end of each job, but the worker runs with engine=None so t2_cpl is
  # never computed inline (CPL is filled in post-hoc by enrich_cpl.py).
  # Result: 0 correction jobs were ever produced. See FINDINGS.md
  # methodology for details. Setting `enabled: false` to be honest about
  # what's actually running.
  enabled: false
  control_group: true
  max_attempts: 2

paths:
  data_dir: data
  jobs_db: jobs/db/jobs_base_rerun.db
  results_file: results/finetuning_experiment/evaluations_base_rerun.jsonl
  logs_dir: results/finetuning_experiment/base_rerun/logs
  plots_dir: results/finetuning_experiment/base_rerun/plots
  metrics_dir: results/finetuning_experiment/base_rerun/metrics
