training:
  dataset_path: "data/board_dataset.jsonl"
  max_seq_length: 512
  num_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  seed: 42
  gguf_quantization: "q4_k_m"

paths:
  hf_models_dir: "/home/rabrew/hf_models"
  checkpoints_dir: "/home/rabrew/finetuned_checkpoints"
  gguf_output_dir: "/home/rabrew/finetuned_gguf"
  ollama_modelfiles_dir: "/home/rabrew/ollama_modelfiles"
