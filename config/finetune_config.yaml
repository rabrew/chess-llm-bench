# Fine-tuning configuration for chess board comprehension curriculum
#
# VRAM guide: 4-bit QLoRA on RTX 4090 (24GB)
#   <15B  — fits easily
#   30-35B — gradient_checkpointing=True
#   70B   — CPU offload (slow, run overnight)
#
# HF IDs marked "# VERIFY" may differ from Ollama naming.
# Confirm at huggingface.co before downloading.

