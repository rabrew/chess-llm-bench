# Lint config (quality gate, 2026-10-24). Run: venv/bin/ruff check src scripts fine-tuning tests
target-version = "py311"
extend-exclude = ["venv", "unsloth_compiled_cache", "dashboard"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Scripts and tests put the repo root (and fine-tuning/src) on sys.path before importing project modules.
"scripts/**" = ["E402"]
"fine-tuning/**" = ["E402"]
"tests/**" = ["E402"]
