# Stage 1b: pieces + legal moves (fine-tuning/specs/legal-moves-finetuning.md).
# Identical to finetune_config.yaml except: batch-1 models only, -board-legal-ft tags,
# dataset_path and max_seq_length. Trained on the RTX 5080 (16 GB VRAM).

models:
  - ollama_base: "llama3.2:3b"
    hf_id: "meta-llama/Llama-3.2-3B-Instruct"
    ollama_ft_tag: "llama3.2:3b-board-legal-ft"

  - ollama_base: "gemma3:4b"
    hf_id: "google/gemma-3-4b-it"
    ollama_ft_tag: "gemma3:4b-board-legal-ft"
    attn_implementation: "eager"

  - ollama_base: "qwen2.5:7b"
    hf_id: "Qwen/Qwen2.5-7B-Instruct"
    ollama_ft_tag: "qwen2.5:7b-board-legal-ft"

  - ollama_base: "mistral:7b"
    hf_id: "mistralai/Mistral-7B-Instruct-v0.3"
    ollama_ft_tag: "mistral:7b-board-legal-ft"

  - ollama_base: "deepseek-r1:7b"
    hf_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
    ollama_ft_tag: "deepseek-r1:7b-board-legal-ft"


training:
  dataset_path: "data/board_legal_dataset.jsonl"
  max_seq_length: 768  # longest target ~414 Llama tokens; other tokenizers run longer
  num_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  seed: 42
  gguf_quantization: "q4_k_m"

paths:
  hf_models_dir: "/home/rabrew/hf_models"
  checkpoints_dir: "/home/rabrew/finetuned_checkpoints"
  gguf_output_dir: "/home/rabrew/finetuned_gguf"
  ollama_modelfiles_dir: "/home/rabrew/ollama_modelfiles"
  merge_work_dir: "/mnt/shared/merge_work"     # reexport_gguf.py scratch (~20 GB for a 4B model)
  llama_cpp_dir: "~/.unsloth/llama.cpp"        # convert_hf_to_gguf.py and llama-quantize
